spring.application.name=Humami
spring.data.mongodb.uri=mongodb://localhost:27017
spring.data.mongodb.port=27017
spring.data.mongodb.database=humami
embedding.api.url=
embedding.api.key=
# Object storage (spec 034): both buckets live in humami.storage.region. Public images are served
# from public-base-url (CloudFront); leave it empty to fall back to presigned media URLs.
humami.storage.region=${HUMAMI_STORAGE_REGION:eu-west-3}
humami.storage.media.bucket=${HUMAMI_STORAGE_MEDIA_BUCKET:humami-media-eu}
humami.storage.media.public-base-url=${HUMAMI_STORAGE_MEDIA_PUBLIC_BASE_URL:https://img.humami.es}
humami.storage.private.bucket=${HUMAMI_STORAGE_PRIVATE_BUCKET:humami-private-eu}
aws.s3.access-key=
aws.s3.secret-key=
humami.auth.write-secret=${HUMAMI_WRITE_SECRET:}
humami.about.title=La historia detrás de Humami
humami.about.story-line-1=Humami nace de una mezcla personal entre tecnología y cocina de raíz.
humami.about.story-line-2=Detrás del proyecto está Hugo, developer e hijo de profesora de cocina.
humami.about.story-line-3=Desde Galicia, Humami une método y sabor para cocinar mejor cada día.
humami.about.photo-url=
humami.about.updated-at=2026-03-19T00:00:00Z
humami.guides.public-api-url=${HUMAMI_GUIDES_PUBLIC_API_URL:https://humami.es/api}
humami.guides.access-days=${HUMAMI_GUIDES_ACCESS_DAYS:30}
humami.guides.email.enabled=${HUMAMI_GUIDES_EMAIL_ENABLED:false}
humami.guides.email.from=${HUMAMI_GUIDES_EMAIL_FROM:}

# Private guide PDFs and other authenticated assets may be up to 10 MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
