# Append to the existing proxy config; preserve production server blocks.
server {
  listen 80;
  server_name dev.humami.es;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://dev.humami.es$request_uri; }
}

server {
  listen 443 ssl;
  server_name dev.humami.es;
  ssl_certificate /etc/letsencrypt/live/dev.humami.es/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dev.humami.es/privkey.pem;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 10m;

  location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
  # Real object storage credentials are intentionally unavailable in dev.
  location ~ ^/api/(meals/[^/]+/image|about/image|blog/[^/]+/cover)/?$ { return 503; }
  location /api/ {
    set $dev_backend http://humami-dev-backend:8080;
    proxy_pass $dev_backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / {
    set $dev_frontend http://humami-dev-frontend:3000;
    proxy_pass $dev_frontend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
