version: '3.9'

services:
  backend:
    image: ghcr.io/${GHCR_OWNER}/humami-backend:${IMAGE_TAG}
    container_name: humami-backend
    expose:
      - "8080"
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI}
      S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      S3_BUCKET: ${AWS_S3_BUCKET_NAME}
      AWS_S3_REGION: ${AWS_S3_REGION}
      HUMAMI_WRITE_SECRET: ${HUMAMI_WRITE_SECRET}
    profiles: ["prod"]

  frontend:
    image: ghcr.io/${GHCR_OWNER}/humami-frontend:${IMAGE_TAG}
    container_name: humami-frontend
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    profiles: ["prod"]

  nginx:
    image: nginx:alpine
    container_name: humami-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    profiles: ["prod"]

  certbot:
    image: certbot/certbot
    container_name: humami-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    profiles: ["prod"]
